# Is the Sparkle signing key usable? Answered without building anything.
#
# There is one secret, SPARKLE_ED_PRIVATE_KEY, and the public key the app ships
# is derived from it - so the two cannot disagree. What can still be wrong is
# the secret itself: unset, truncated, or something that is not a key. This says
# which, in twenty seconds, and can be run whenever the key is rotated.
name: check sparkle keys

on:
  workflow_dispatch:

jobs:
  keys:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read the signing key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # Length only - never the value. Enough to tell "not set" from
          # "pasted the wrong thing" without putting a key in a public log.
          echo "private key: ${#SPARKLE_ED_PRIVATE_KEY} characters (generate_keys -x writes 128)"
          # Assigned on its own line. Inlined into an echo, a derivation that
          # threw would leave this step green - and a check that passes on a
          # broken key is worse than no check. Same mistake cost the v0.1.3
          # release a full build.
          public=$(node scripts/check-sparkle-keypair.mjs --print-public)
          # The public key is not secret: it ships inside every build.
          echo "public key derived from it: $public"
          echo "This is the value that goes into Info.plist as SUPublicEDKey."
