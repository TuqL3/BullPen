name: release

# Tag-driven. `npm version <patch|minor|major>` writes package.json and the
# matching `vX.Y.Z` tag in one step, and pushing that tag is the whole release.
on:
  push:
    tags:
      - 'v*'

# electron-builder uploads the packages to the release with this token, so the
# job needs to be allowed to write one.
permissions:
  contents: write

jobs:
  # The draft is created once, here, so the two builders below never race to
  # create the same release. Both of them find it and upload into it.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # electron-builder publishes to `v${package.json version}`, not to the tag
      # that started the run. A mismatch is not an error it reports - it quietly
      # opens a second release nobody tagged and puts the artifacts there.
      - name: Refuse a tag that does not match package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag is $GITHUB_REF_NAME but package.json says $want" >&2
            exit 1
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already exists - re-running into it"
          else
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # macOS updates through Sparkle, which needs two things Windows does not: the
  # app packaged with the EdDSA public key inside it, and an appcast.xml signed
  # with the matching private key uploaded beside the archives.
  mac:
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # One secret, and the public key derived from it.
      #
      # There used to be two, and keeping them in step by hand is what broke
      # every release attempt so far: generate_appcast compares the public key
      # inside the packaged app against the public half carried in the private
      # key, and when those disagree it writes an unsigned appcast, prints
      # nothing and exits 0. Two values a human copies separately drift. One
      # value and a derivation cannot.
      #
      # Plain node, no dependencies, so this runs before `npm ci` - a key this
      # cannot read costs ten seconds instead of a full macOS build.
      - name: Derive the public key from the signing key
        id: key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::secret SPARKLE_ED_PRIVATE_KEY is empty or unset in this job"
            echo "Set it as a *repository* secret on the repo this tag was pushed to:" >&2
            echo "  https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions" >&2
            echo "Environment and Dependabot secrets are separate stores and do not reach" >&2
            echo "this job. Org secrets must additionally grant access to this repo." >&2
            exit 1
          fi
          # Assigned on its own line, and not inlined into the echo below.
          # `echo "public=$(cmd)"` reports the exit status of *echo*, so a
          # derivation that threw would leave this step green with an empty
          # output - and an empty output packages the placeholder, which is not
          # discovered until a ten-minute build has already finished. That is
          # exactly how v0.1.3 failed.
          public=$(node scripts/check-sparkle-keypair.mjs --print-public)
          if [ -z "$public" ]; then
            echo "::error::the derivation produced an empty public key" >&2
            echo "signing key: ${#SPARKLE_ED_PRIVATE_KEY} characters (generate_keys -x writes 44 in the current format)" >&2
            exit 1
          fi
          # The public key is not secret - it ships inside the app - so it can
          # travel between steps in the clear, and the private key never has to
          # enter the packaging step at all.
          # Every copy of this app already installed validates against the key
          # it was built with, and nothing can change that key afterwards. So a
          # rotated signing key does not break the next release - it orphans
          # every release before it, permanently and silently: Sparkle fetches
          # the appcast, rejects the signature, and a background check raises no
          # window to say so. That is how 0.1.1 sat through eight versions.
          #
          # The committed file is the record of which key the copies out there
          # carry. Rotating on purpose means editing it in the same commit and
          # telling people to reinstall by hand; rotating by accident stops here.
          pinned=$(tr -d '[:space:]' < sparkle-public-key.txt)
          if [ "$public" != "$pinned" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY does not belong to the public key this repo ships." >&2
            echo "  sparkle-public-key.txt: $pinned" >&2
            echo "  derived from the secret: $public" >&2
            echo "Every already-installed copy carries the pinned key and will reject an" >&2
            echo "update signed with any other one - silently, with no way to recover but" >&2
            echo "a manual reinstall. Restore the old signing key, or - if the rotation is" >&2
            echo "deliberate - commit the new public key to sparkle-public-key.txt and tell" >&2
            echo "everyone on an older version to download this release by hand." >&2
            exit 1
          fi
          echo "public=$public" >> "$GITHUB_OUTPUT"
          echo "derived a ${#public}-character public key from a ${#SPARKLE_ED_PRIVATE_KEY}-character signing key"

      - run: npm ci

      # Fetches Sparkle.framework and compiles the bridge against this project's
      # Electron ABI. Must run before the packaging step, which reads the
      # framework's localization list straight off the vendored copy.
      - run: npm run rebuild:sparkle

      - run: npm run build

      - name: Package and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_PUBLIC_KEY: ${{ steps.key.outputs.public }}
          # No Developer ID, and Sparkle does not need one - it validates the
          # EdDSA signature on the archive instead. The bundle is ad-hoc signed
          # in scripts/after-pack.mjs, which is all Sparkle asks for.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: |
          # The other end of the same wire. The step above proves a key was
          # derived; this proves it arrived here, before ten minutes are spent
          # packaging the placeholder instead.
          if [ -z "$SPARKLE_ED_PUBLIC_KEY" ]; then
            echo "::error::SPARKLE_ED_PUBLIC_KEY did not reach the packaging step" >&2
            exit 1
          fi
          echo "packaging with a ${#SPARKLE_ED_PUBLIC_KEY}-character public key"
          npx electron-builder --config electron-builder.config.mjs --mac -p always

      # The derivation was checked against the secret; this checks what the
      # build actually put in the bundle. A packaging step that never received
      # the variable, or a stale `release/`, lands here and nowhere earlier -
      # and this is the exact value generate_appcast will compare.
      - name: Refuse a package whose key does not match the signing key
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          plist=$(ls -d release/mac-universal/*.app/Contents/Info.plist | head -1)
          node scripts/check-sparkle-keypair.mjs --plist "$plist"

      # Sparkle updates out of the zips, so only the zips go to generate_appcast.
      # Pointed at a staging directory rather than at `release/` because that
      # also holds the dmgs, and generate_appcast would write a second appcast
      # item per version for an archive Sparkle was never meant to update from.
      - name: Sign and publish the appcast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          mkdir -p appcast
          cp release/*-mac.zip appcast/
          key="$RUNNER_TEMP/sparkle_ed_key"
          # ponytail: a file in the runner's temp, not the RAM disk the upstream
          # composite action builds. The runner is ephemeral and single-tenant,
          # and it is deleted in the same step it is written. Ceiling: a step
          # that fails between the two lines leaves it on that disk until the
          # runner is torn down. Move to a RAM disk if this repo ever builds on
          # a self-hosted machine that outlives the job.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key"
          npx electron-sparkle-updater generate-appcast appcast \
            --ed-key-file "$key" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"
          rm -f "$key"

          # generate_appcast will happily write an appcast with no signature in
          # it and exit 0 - no warning, no message. An app whose Info.plist
          # carries a public key then rejects every update it is offered, so the
          # release looks finished and updates nobody. With the public key now
          # derived rather than pasted, the cause this has actually been seen to
          # have is gone; this is the backstop for any other reason it declines.
          if ! grep -q 'sparkle:edSignature' appcast/appcast.xml; then
            echo "::error::appcast.xml has no sparkle:edSignature, and the key in the bundle does match the signing key - so generate_appcast declined for some other reason. The appcast is uploaded by no step after this one." >&2
            exit 1
          fi

          gh release upload "$GITHUB_REF_NAME" appcast/appcast.xml --clobber

  # Windows never had the problem Sparkle solves: NSIS replaces an unsigned
  # install happily, and electron-updater drives it with differential downloads.
  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node-pty is native and its postinstall patch is compiled in, so the copy
      # that ships is built on the platform it runs on rather than cross-built.
      - run: npm ci

      - run: npm run build

      - name: Package and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config electron-builder.config.mjs --win -p always
