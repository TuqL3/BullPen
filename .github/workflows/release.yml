name: release

# Tag-driven. `npm version <patch|minor|major>` writes package.json and the
# matching `vX.Y.Z` tag in one step, and pushing that tag is the whole release.
on:
  push:
    tags:
      - 'v*'

# electron-builder uploads the packages to the release with this token, so the
# job needs to be allowed to write one.
permissions:
  contents: write

jobs:
  # The draft is created once, here, so the two builders below never race to
  # create the same release. Both of them find it and upload into it.
  draft:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # electron-builder publishes to `v${package.json version}`, not to the tag
      # that started the run. A mismatch is not an error it reports - it quietly
      # opens a second release nobody tagged and puts the artifacts there.
      - name: Refuse a tag that does not match package.json
        run: |
          want="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$want" ]; then
            echo "::error::tag is $GITHUB_REF_NAME but package.json says $want" >&2
            exit 1
          fi

      - name: Create the draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "$GITHUB_REF_NAME already exists - re-running into it"
          else
            gh release create "$GITHUB_REF_NAME" --draft \
              --title "$GITHUB_REF_NAME" --generate-notes
          fi

  # macOS updates through Sparkle, which needs two things Windows does not: the
  # app packaged with the EdDSA public key inside it, and an appcast.xml signed
  # with the matching private key uploaded beside the archives.
  mac:
    needs: draft
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Both halves of one keypair. Checked before anything is built rather than
      # after: without the public key the app ships a placeholder and silently
      # never updates, and without the private key there is no appcast for it to
      # read. Either way the release looks complete and updates nothing.
      - name: Refuse to build a mac release with no signing key
        env:
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # Both, then decide. Exiting on the first one costs a round trip
          # through a whole CI run to find out the second was missing too.
          missing=""
          [ -n "$SPARKLE_ED_PUBLIC_KEY" ] || missing="$missing SPARKLE_ED_PUBLIC_KEY"
          [ -n "$SPARKLE_ED_PRIVATE_KEY" ] || missing="$missing SPARKLE_ED_PRIVATE_KEY"
          if [ -n "$missing" ]; then
            echo "::error::empty or unset in this job:$missing"
            echo "Set them as *repository* secrets on the repo this tag was pushed to:" >&2
            echo "  https://github.com/${GITHUB_REPOSITORY}/settings/secrets/actions" >&2
            echo "Environment secrets and Dependabot secrets are separate stores and do" >&2
            echo "not reach this job. Org secrets must additionally grant access to this repo." >&2
            exit 1
          fi

      - run: npm ci

      # Fetches Sparkle.framework and compiles the bridge against this project's
      # Electron ABI. Must run before the packaging step, which reads the
      # framework's localization list straight off the vendored copy.
      - run: npm run rebuild:sparkle

      - run: npm run build

      - name: Package and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_PUBLIC_KEY: ${{ secrets.SPARKLE_ED_PUBLIC_KEY }}
          # No Developer ID, and Sparkle does not need one - it validates the
          # EdDSA signature on the archive instead. The bundle is ad-hoc signed
          # in scripts/after-pack.mjs, which is all Sparkle asks for.
          CSC_IDENTITY_AUTO_DISCOVERY: false
        run: npx electron-builder --config electron-builder.config.mjs --mac -p always

      # Sparkle updates out of the zips, so only the zips go to generate_appcast.
      # Pointed at a staging directory rather than at `release/` because that
      # also holds the dmgs, and generate_appcast would write a second appcast
      # item per version for an archive Sparkle was never meant to update from.
      - name: Sign and publish the appcast
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          mkdir -p appcast
          cp release/*-mac.zip appcast/
          key="$RUNNER_TEMP/sparkle_ed_key"
          # ponytail: a file in the runner's temp, not the RAM disk the upstream
          # composite action builds. The runner is ephemeral and single-tenant,
          # and it is deleted in the same step it is written. Ceiling: a step
          # that fails between the two lines leaves it on that disk until the
          # runner is torn down. Move to a RAM disk if this repo ever builds on
          # a self-hosted machine that outlives the job.
          printf '%s' "$SPARKLE_ED_PRIVATE_KEY" > "$key"
          npx electron-sparkle-updater generate-appcast appcast \
            --ed-key-file "$key" \
            --download-url-prefix "https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/"
          rm -f "$key"

          # generate_appcast will happily write an appcast with no signature in
          # it and exit 0 - no warning, no message. An app whose Info.plist
          # carries SUPublicEDKey then rejects every update it is offered, so
          # the release looks finished and updates nobody. Checked rather than
          # trusted.
          if ! grep -q 'sparkle:edSignature' appcast/appcast.xml; then
            echo "::error::appcast.xml has no sparkle:edSignature - the private key was not in the format generate_appcast expects (use the file written by \`generate_keys -x\`)" >&2
            exit 1
          fi

          gh release upload "$GITHUB_REF_NAME" appcast/appcast.xml --clobber

  # Windows never had the problem Sparkle solves: NSIS replaces an unsigned
  # install happily, and electron-updater drives it with differential downloads.
  windows:
    needs: draft
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # node-pty is native and its postinstall patch is compiled in, so the copy
      # that ships is built on the platform it runs on rather than cross-built.
      - run: npm ci

      - run: npm run build

      - name: Package and upload
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --config electron-builder.config.mjs --win -p always
